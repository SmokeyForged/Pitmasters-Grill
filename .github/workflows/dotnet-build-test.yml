name: dotnet-build-test

on:
  push:
    branches:
      - main
      - v*
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: PMG-28 guarded composition cutover
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          import sys

          def read_preserved(path):
              raw = Path(path).read_bytes()
              bom = raw.startswith(b"\xef\xbb\xbf")
              text = raw.decode("utf-8-sig")
              newline = "\r\n" if "\r\n" in text else "\n"
              return text.replace("\r\n", "\n"), newline, bom

          def write_preserved(path, text, newline, bom):
              data = text.replace("\n", newline).encode("utf-8")
              if bom:
                  data = b"\xef\xbb\xbf" + data
              Path(path).write_bytes(data)

          xaml_path = "PitmastersGrill/MainWindow.xaml"
          ctor_path = "PitmastersGrill/MainWindow.ComposedConstructor.cs"
          main_path = "PitmastersGrill/MainWindow.xaml.cs"

          xaml, xaml_nl, xaml_bom = read_preserved(xaml_path)
          ctor, ctor_nl, ctor_bom = read_preserved(ctor_path)
          main, main_nl, main_bom = read_preserved(main_path)

          already_applied = (
              'x:Name="VersionUpdateViewControl"' in xaml
              and "VersionUpdateViewControl.SetManualUpdateCheckEnabled" in ctor
              and "ManualUpdateCheckButton_Click" not in main
              and "GitHubRepoLink_RequestNavigate" not in main
          )
          if already_applied:
              print("PMG-28 composition cutover already applied; no-op.")
              sys.exit(0)

          xaml_pattern = re.compile(
              r'                            <TabItem Header="Version" Style="\{StaticResource PmgNestedSubTabItemStyle\}" Background="#1E252C" Foreground="#F2EFE6">\n.*?                            </TabItem>\n\n                            <TabItem Header="Diagnostics"',
              re.S,
          )
          xaml_replacement = '''                            <TabItem Header="Version" Style="{StaticResource PmgNestedSubTabItemStyle}" Background="#1E252C" Foreground="#F2EFE6">
                                <views:VersionUpdateView x:Name="VersionUpdateViewControl"
                                                         RepositoryNavigateRequested="VersionUpdateView_RepositoryNavigateRequested"
                                                         ManualUpdateCheckRequested="VersionUpdateView_ManualUpdateCheckRequested"
                                                         AutomationProperties.AutomationId="VersionUpdateViewControl"/>
                            </TabItem>

                            <TabItem Header="Diagnostics"'''

          ctor_old = '''            _manualUpdateCheckController = new ManualUpdateCheckController(
                this,
                ManualUpdateCheckButton,
                ManualUpdateStatusText,
                _browserLauncher,
                _appSettings,
                _windowShutdownCts.Token,
                () => _isShuttingDown);'''
          ctor_new = '''            _manualUpdateCheckController = new ManualUpdateCheckController(
                this,
                VersionUpdateViewControl.SetManualUpdateCheckEnabled,
                VersionUpdateViewControl.SetManualUpdateStatusText,
                OpenManualUpdateReleasePage,
                _appSettings,
                _windowShutdownCts.Token,
                () => _isShuttingDown);'''

          manual_old = '''
        private async void ManualUpdateCheckButton_Click(object sender, RoutedEventArgs e)
        {
            if (_manualUpdateCheckController == null)
            {
                return;
            }

            await _manualUpdateCheckController.RunAsync();
        }
'''
          github_old = '''
        private void GitHubRepoLink_RequestNavigate(object sender, RequestNavigateEventArgs e)
        {
            var url = e.Uri?.AbsoluteUri ?? "https://github.com/SmokeyForged/Pitmasters-Grill";
            var result = ExternalNavigation.OpenUrl(url, "GitHub repository");
            ShowExternalNavigationErrorIfNeeded(result);
            e.Handled = true;
        }
'''

          if len(xaml_pattern.findall(xaml)) != 1:
              raise SystemExit("Expected exactly one inline Version tab block before cutover.")
          if ctor.count(ctor_old) != 1:
              raise SystemExit("Expected exactly one legacy ManualUpdateCheckController composition block.")
          if main.count(manual_old) != 1:
              raise SystemExit("Expected exactly one legacy ManualUpdateCheckButton_Click method.")
          if main.count(github_old) != 1:
              raise SystemExit("Expected exactly one legacy GitHubRepoLink_RequestNavigate method.")

          xaml = xaml_pattern.sub(xaml_replacement, xaml, count=1)
          ctor = ctor.replace(ctor_old, ctor_new, 1)
          main = main.replace(manual_old, "\n", 1).replace(github_old, "\n", 1)

          write_preserved(xaml_path, xaml, xaml_nl, xaml_bom)
          write_preserved(ctor_path, ctor, ctor_nl, ctor_bom)
          write_preserved(main_path, main, main_nl, main_bom)
          '@ | Set-Content -Path .pmg28-cutover.py -Encoding utf8

          python .pmg28-cutover.py
          Remove-Item .pmg28-cutover.py

          $actual = @(git diff --name-only | Sort-Object)
          $expected = @(
            'PitmastersGrill/MainWindow.ComposedConstructor.cs',
            'PitmastersGrill/MainWindow.xaml',
            'PitmastersGrill/MainWindow.xaml.cs'
          ) | Sort-Object
          if (Compare-Object $expected $actual) {
            throw "PMG-28 cutover changed an unexpected file set: $($actual -join ', ')"
          }

          git --no-pager diff --check
          git config user.name "Smokey Labs"
          git config user.email "greg.mcever@live.com"
          git add -- PitmastersGrill/MainWindow.xaml PitmastersGrill/MainWindow.xaml.cs PitmastersGrill/MainWindow.ComposedConstructor.cs
          git commit -m "PMG-95 PMG-96 compose Version Updates view"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PitmastersGrill\PitmastersGrill.slnx

      - name: Build
        run: dotnet build PitmastersGrill\PitmastersGrill.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PitmastersGrill.Tests\PitmastersGrill.Tests.csproj --configuration Release --no-build
