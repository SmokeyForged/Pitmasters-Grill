name: pmg16-branch-cutover

on:
  push:
    branches:
      - fix/pmg-16-grill-ownership-gaps

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/pmg-16-grill-ownership-gaps
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply bounded PMG-16 ownership cutover
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $mainPath = 'PitmastersGrill/MainWindow.xaml.cs'
          $main = Get-Content $mainPath -Raw
          $main = $main.Replace("        private const int CompactDragHoldMilliseconds = 300;`r`n", '')
          $main = $main.Replace(@'
            var started = _compactBoardDragController.TryBegin(
                CompactModeToggleButton?.IsChecked == true,
                e.ClickCount,
                IsFromCompactDragBlockedElement(e.OriginalSource as DependencyObject));
'@, @'
            var started = _compactBoardDragController.TryBegin(
                CompactModeToggleButton?.IsChecked == true,
                e.ClickCount,
                e.OriginalSource as DependencyObject);
'@)
          $main = $main.Replace(@'
            if (!_compactBoardDragController.CompleteHold(
                    CompactModeToggleButton?.IsChecked == true,
                    Mouse.LeftButton == MouseButtonState.Pressed))
            {
                return;
            }
'@, @'
            if (_compactBoardDragController.CompleteHoldAction(
                    CompactModeToggleButton?.IsChecked == true,
                    Mouse.LeftButton == MouseButtonState.Pressed) != CompactBoardDragAction.RequestDrag)
            {
                return;
            }
'@)
          $blockedMethod = @'
        private static bool IsFromCompactDragBlockedElement(DependencyObject? source)
        {
            // Rows and column headers are valid compact-mode drag surfaces.
            // Only block elements where click/hold has a separate interactive meaning.
            // DataGridColumnHeader derives from ButtonBase in WPF, so allow it before the generic button check.
            if (FindVisualParent<DataGridColumnHeader>(source) != null)
            {
                return FindVisualParent<Thumb>(source) != null;
            }

            return FindVisualParent<ButtonBase>(source) != null ||
                   FindVisualParent<ScrollBar>(source) != null ||
                   FindVisualParent<TextBox>(source) != null ||
                   FindVisualParent<ComboBox>(source) != null ||
                   FindVisualParent<Thumb>(source) != null;
        }

'@
          $main = $main.Replace($blockedMethod, '')
          Set-Content $mainPath $main -Encoding utf8

          $ctorPath = 'PitmastersGrill/MainWindow.ComposedConstructor.cs'
          $ctor = Get-Content $ctorPath -Raw
          $ctor = $ctor.Replace('Interval = TimeSpan.FromMilliseconds(CompactDragHoldMilliseconds)', 'Interval = CompactBoardDragController.HoldDuration')
          Set-Content $ctorPath $ctor -Encoding utf8

          @'
          using System;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Controls.Primitives;
          using System.Windows.Media;

          namespace PitmastersGrill.Services
          {
              public enum CompactBoardDragAction
              {
                  None,
                  RequestDrag
              }

              public sealed class CompactBoardDragController
              {
                  public static TimeSpan HoldDuration { get; } = TimeSpan.FromMilliseconds(300);

                  public bool IsPending { get; private set; }

                  public bool TryBegin(bool boardModeEnabled, int clickCount, DependencyObject? source)
                  {
                      if (IsPending || !boardModeEnabled)
                      {
                          return false;
                      }

                      if (clickCount > 1)
                      {
                          Cancel();
                          return false;
                      }

                      if (IsBlockedByInteractiveElement(source))
                      {
                          return false;
                      }

                      IsPending = true;
                      return true;
                  }

                  public void Cancel()
                  {
                      IsPending = false;
                  }

                  public bool CancelIfLeftButtonReleased(bool leftButtonPressed)
                  {
                      if (!IsPending || leftButtonPressed)
                      {
                          return false;
                      }

                      Cancel();
                      return true;
                  }

                  public CompactBoardDragAction CompleteHoldAction(bool boardModeEnabled, bool leftButtonPressed)
                  {
                      if (!IsPending || !boardModeEnabled || !leftButtonPressed)
                      {
                          Cancel();
                          return CompactBoardDragAction.None;
                      }

                      IsPending = false;
                      return CompactBoardDragAction.RequestDrag;
                  }

                  public static bool IsBlockedByInteractiveElement(DependencyObject? source)
                  {
                      if (FindParent<DataGridColumnHeader>(source) != null)
                      {
                          return FindParent<Thumb>(source) != null;
                      }

                      return FindParent<ButtonBase>(source) != null ||
                             FindParent<ScrollBar>(source) != null ||
                             FindParent<TextBox>(source) != null ||
                             FindParent<ComboBox>(source) != null ||
                             FindParent<Thumb>(source) != null;
                  }

                  private static T? FindParent<T>(DependencyObject? source)
                      where T : DependencyObject
                  {
                      while (source != null)
                      {
                          if (source is T match)
                          {
                              return match;
                          }

                          source = GetParentObject(source);
                      }

                      return null;
                  }

                  private static DependencyObject? GetParentObject(DependencyObject source)
                  {
                      if (source is FrameworkElement frameworkElement && frameworkElement.Parent != null)
                      {
                          return frameworkElement.Parent;
                      }

                      if (source is FrameworkContentElement frameworkContentElement && frameworkContentElement.Parent != null)
                      {
                          return frameworkContentElement.Parent;
                      }

                      try
                      {
                          return VisualTreeHelper.GetParent(source);
                      }
                      catch (InvalidOperationException)
                      {
                          return null;
                      }
                  }
              }
          }
          '@ | ForEach-Object { $_ -replace '^          ', '' } | Set-Content 'PitmastersGrill/Services/CompactBoardDragController.cs' -Encoding utf8

          @'
          using PitmastersGrill.Services;
          using System;
          using System.Runtime.ExceptionServices;
          using System.Threading;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Controls.Primitives;
          using Xunit;

          namespace PitmastersGrill.Tests.Services
          {
              public sealed class CompactBoardDragControllerTests
              {
                  [Fact]
                  public void HoldDuration_PreservesThreeHundredMillisecondPolicy()
                  {
                      Assert.Equal(TimeSpan.FromMilliseconds(300), CompactBoardDragController.HoldDuration);
                  }

                  [Fact]
                  public void TryBegin_EligiblePointerDown_StartsPendingDrag()
                  {
                      var subject = new CompactBoardDragController();

                      var started = subject.TryBegin(true, 1, source: null);

                      Assert.True(started);
                      Assert.True(subject.IsPending);
                  }

                  [Fact]
                  public void TryBegin_DoubleClick_DoesNotStart()
                  {
                      var subject = new CompactBoardDragController();

                      Assert.False(subject.TryBegin(true, 2, source: null));
                      Assert.False(subject.IsPending);
                  }

                  [Fact]
                  public void TryBegin_DuplicateRoutedDelivery_LeavesExistingPendingDragIntact()
                  {
                      var subject = new CompactBoardDragController();
                      Assert.True(subject.TryBegin(true, 1, source: null));

                      Assert.False(subject.TryBegin(true, 2, source: null));
                      Assert.True(subject.IsPending);
                  }

                  [Fact]
                  public void Cancel_ReleaseBeforeHold_ClearsPendingDrag()
                  {
                      var subject = PendingSubject();

                      subject.Cancel();

                      Assert.False(subject.IsPending);
                  }

                  [Fact]
                  public void CancelIfLeftButtonReleased_LostButtonState_CancelsPendingDrag()
                  {
                      var subject = PendingSubject();

                      Assert.True(subject.CancelIfLeftButtonReleased(false));
                      Assert.False(subject.IsPending);
                  }

                  [Fact]
                  public void CompleteHoldAction_EligiblePendingDrag_RequestsDragExactlyOnce()
                  {
                      var subject = PendingSubject();

                      Assert.Equal(CompactBoardDragAction.RequestDrag, subject.CompleteHoldAction(true, true));
                      Assert.Equal(CompactBoardDragAction.None, subject.CompleteHoldAction(true, true));
                      Assert.False(subject.IsPending);
                  }

                  [Theory]
                  [InlineData(false, true)]
                  [InlineData(true, false)]
                  [InlineData(false, false)]
                  public void CompleteHoldAction_WhenEligibilityIsLost_CancelsWithoutDrag(bool boardModeEnabled, bool leftButtonPressed)
                  {
                      var subject = PendingSubject();

                      Assert.Equal(CompactBoardDragAction.None, subject.CompleteHoldAction(boardModeEnabled, leftButtonPressed));
                      Assert.False(subject.IsPending);
                  }

                  [Fact]
                  public void BlockedElementPolicy_PreservesInteractiveBoundaries()
                  {
                      RunOnStaThread(() =>
                      {
                          Assert.False(CompactBoardDragController.IsBlockedByInteractiveElement(new Border()));
                          Assert.True(CompactBoardDragController.IsBlockedByInteractiveElement(new Button()));
                          Assert.True(CompactBoardDragController.IsBlockedByInteractiveElement(new TextBox()));
                          Assert.True(CompactBoardDragController.IsBlockedByInteractiveElement(new ComboBox()));
                          Assert.True(CompactBoardDragController.IsBlockedByInteractiveElement(new ScrollBar()));
                          Assert.True(CompactBoardDragController.IsBlockedByInteractiveElement(new Thumb()));
                          Assert.False(CompactBoardDragController.IsBlockedByInteractiveElement(new DataGridColumnHeader()));
                      });
                  }

                  private static CompactBoardDragController PendingSubject()
                  {
                      var subject = new CompactBoardDragController();
                      Assert.True(subject.TryBegin(true, 1, source: null));
                      return subject;
                  }

                  private static void RunOnStaThread(Action action)
                  {
                      Exception? capturedException = null;
                      var thread = new Thread(() =>
                      {
                          try
                          {
                              action();
                          }
                          catch (Exception ex)
                          {
                              capturedException = ex;
                          }
                      });
                      thread.SetApartmentState(ApartmentState.STA);
                      thread.Start();
                      thread.Join();
                      if (capturedException != null)
                      {
                          ExceptionDispatchInfo.Capture(capturedException).Throw();
                      }
                  }
              }
          }
          '@ | ForEach-Object { $_ -replace '^          ', '' } | Set-Content 'PitmastersGrill.Tests/Services/CompactBoardDragControllerTests.cs' -Encoding utf8

          @'
          using System;
          using System.IO;
          using Xunit;

          namespace PitmastersGrill.Tests.Services
          {
              public sealed class MainWindowCompactDragOwnershipTests
              {
                  [Fact]
                  public void MainWindow_DelegatesCompactDragPolicyAndPreservesHandledEventRouting()
                  {
                      var source = ReadRepoFile("PitmastersGrill", "MainWindow.xaml.cs");
                      var constructor = ReadRepoFile("PitmastersGrill", "MainWindow.ComposedConstructor.cs");

                      Assert.DoesNotContain("_compactDragPending", source, StringComparison.Ordinal);
                      Assert.DoesNotContain("_compactDragStartPoint", source, StringComparison.Ordinal);
                      Assert.DoesNotContain("CompactDragHoldMilliseconds", source, StringComparison.Ordinal);
                      Assert.DoesNotContain("IsFromCompactDragBlockedElement", source, StringComparison.Ordinal);
                      Assert.Contains("e.OriginalSource as DependencyObject", source, StringComparison.Ordinal);
                      Assert.Contains("CompactBoardDragAction.RequestDrag", source, StringComparison.Ordinal);
                      Assert.Contains("Interval = CompactBoardDragController.HoldDuration", constructor, StringComparison.Ordinal);

                      Assert.Contains("PilotBoard.AddHandler(UIElement.PreviewMouseDownEvent, new MouseButtonEventHandler(PilotBoard_PreviewMouseDownHandledToo), true);", source, StringComparison.Ordinal);
                      Assert.Contains("PilotBoard.AddHandler(UIElement.PreviewMouseUpEvent, new MouseButtonEventHandler(PilotBoard_PreviewMouseUpHandledToo), true);", source, StringComparison.Ordinal);
                      Assert.Contains("PilotBoard.AddHandler(UIElement.PreviewMouseMoveEvent, new MouseEventHandler(PilotBoard_PreviewMouseMoveHandledToo), true);", source, StringComparison.Ordinal);
                  }

                  [Fact]
                  public void CompactDragController_OwnsBlockedElementPolicy()
                  {
                      var source = ReadRepoFile("PitmastersGrill", "Services", "CompactBoardDragController.cs");

                      Assert.Contains("FindParent<DataGridColumnHeader>(source)", source, StringComparison.Ordinal);
                      Assert.Contains("FindParent<Thumb>(source) != null", source, StringComparison.Ordinal);
                      Assert.Contains("FindParent<ButtonBase>(source) != null", source, StringComparison.Ordinal);
                      Assert.Contains("FindParent<ScrollBar>(source) != null", source, StringComparison.Ordinal);
                      Assert.Contains("FindParent<TextBox>(source) != null", source, StringComparison.Ordinal);
                      Assert.Contains("FindParent<ComboBox>(source) != null", source, StringComparison.Ordinal);
                  }

                  private static string ReadRepoFile(params string[] relativeSegments)
                  {
                      var current = new DirectoryInfo(AppContext.BaseDirectory);
                      while (current is not null)
                      {
                          var candidateSegments = new string[relativeSegments.Length + 1];
                          candidateSegments[0] = current.FullName;
                          Array.Copy(relativeSegments, 0, candidateSegments, 1, relativeSegments.Length);
                          var candidate = Path.Combine(candidateSegments);
                          if (File.Exists(candidate))
                          {
                              return File.ReadAllText(candidate);
                          }
                          current = current.Parent;
                      }
                      throw new FileNotFoundException($"Could not locate repository file: {string.Join("/", relativeSegments)}");
                  }
              }
          }
          '@ | ForEach-Object { $_ -replace '^          ', '' } | Set-Content 'PitmastersGrill.Tests/Services/MainWindowCompactDragOwnershipTests.cs' -Encoding utf8

          Remove-Item '.github/workflows/pmg16-branch-cutover.yml'

          git --no-pager diff --check
          dotnet restore PitmastersGrill/PitmastersGrill.slnx
          dotnet build PitmastersGrill/PitmastersGrill.slnx --configuration Release --no-restore
          dotnet test PitmastersGrill.Tests/PitmastersGrill.Tests.csproj --configuration Release --no-build

          git config user.name 'Dev Athena'
          git config user.email 'actions@users.noreply.github.com'
          git add PitmastersGrill/MainWindow.xaml.cs PitmastersGrill/MainWindow.ComposedConstructor.cs PitmastersGrill/Services/CompactBoardDragController.cs PitmastersGrill.Tests/Services/CompactBoardDragControllerTests.cs PitmastersGrill.Tests/Services/MainWindowCompactDragOwnershipTests.cs .github/workflows/pmg16-branch-cutover.yml
          git --no-pager diff --cached --stat
          git --no-pager diff --cached --check
          git commit -m 'PMG-61 PMG-63 PMG-65 complete compact drag ownership'
          git push origin HEAD:fix/pmg-16-grill-ownership-gaps
