#!/usr/bin/env python3
"""
Fix PMG draft-release workflow missing-release check.

Usage:
  python fix_pmg_draft_release_missing_release_exit.py --repo-root . --dry-run
  python fix_pmg_draft_release_missing_release_exit.py --repo-root .

This updates .github/workflows/draft-release.yml so the expected
"release not found" result from `gh release view` exits the workflow step
successfully, while an existing release still fails hard.
"""

from __future__ import annotations

import argparse
from pathlib import Path


OLD = """      - name: Refuse if release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"

          $output = gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" 2>&1
          $exitCode = $LASTEXITCODE

          if ($exitCode -eq 0) {
            Write-Host $output
            throw "Release $env:RELEASE_TAG already exists. Refusing to overwrite or mutate an existing release."
          }

          Write-Host "No existing release found for $env:RELEASE_TAG. Continuing."
"""

NEW = """      - name: Refuse if release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"

          $output = gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" 2>&1
          $exitCode = $LASTEXITCODE
          $outputText = ($output | Out-String).Trim()

          if ($exitCode -eq 0) {
            Write-Host $outputText
            throw "Release $env:RELEASE_TAG already exists. Refusing to overwrite or mutate an existing release."
          }

          if ($outputText -notmatch "release not found|Not Found") {
            Write-Host $outputText
            throw "Unable to verify whether release $env:RELEASE_TAG already exists."
          }

          Write-Host "No existing release found for $env:RELEASE_TAG. Continuing."
          $global:LASTEXITCODE = 0
          exit 0
"""


def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument("--repo-root", default=".", help="Repository root path")
    parser.add_argument("--dry-run", action="store_true", help="Report only; do not write")
    args = parser.parse_args()

    repo_root = Path(args.repo_root).resolve()
    workflow_path = repo_root / ".github" / "workflows" / "draft-release.yml"

    if not workflow_path.exists():
        raise SystemExit(f"Workflow file not found: {workflow_path}")

    text = workflow_path.read_text(encoding="utf-8-sig")

    count = text.count(OLD)
    if count != 1:
        raise SystemExit(f"Expected exactly one release-exists block to replace, found {count}.")

    updated = text.replace(OLD, NEW, 1)

    if args.dry_run:
        print(f"[dry-run] Would update {workflow_path}")
        print("[dry-run] Missing release will now reset LASTEXITCODE and exit 0.")
        print("[dry-run] Non-auth/non-not-found gh failures will still fail.")
        return 0

    workflow_path.write_text(updated, encoding="utf-8", newline="\n")
    print(f"Updated {workflow_path}")
    print("Missing release now exits the check step successfully.")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
