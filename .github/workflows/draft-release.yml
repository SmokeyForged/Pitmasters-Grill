#!/usr/bin/env python3
# Update PMG draft-release workflow with release_kind audit input.
#
# Usage:
#   python update_pmg_draft_release_workflow_release_kind.py --repo-root . --dry-run
#   python update_pmg_draft_release_workflow_release_kind.py --repo-root .
#
# Intent:
# - Keep operator-supplied version as authoritative.
# - Add release_kind as audit/context only.
# - Include release_kind in workflow logs and package summary.

from __future__ import annotations

import argparse
from pathlib import Path


def replace_once(text: str, old: str, new: str, label: str) -> str:
    count = text.count(old)
    if count != 1:
        raise SystemExit(f"Expected exactly one match for {label}, found {count}.")
    return text.replace(old, new, 1)


def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument("--repo-root", default=".", help="Repository root path")
    parser.add_argument("--dry-run", action="store_true", help="Report only; do not write")
    args = parser.parse_args()

    repo_root = Path(args.repo_root).resolve()
    workflow_path = repo_root / ".github" / "workflows" / "draft-release.yml"

    if not workflow_path.exists():
        raise SystemExit(f"Workflow file not found: {workflow_path}")

    text = workflow_path.read_text(encoding="utf-8-sig")

    if "release_kind:" in text:
        print("No change needed: release_kind input already exists.")
        return 0

    old_inputs = """      version:
        description: "Release version to draft, for example 1.4.0"
        required: true
        type: string
"""

    new_inputs = """      version:
        description: "Release version to draft, for example 1.4.0"
        required: true
        type: string
      release_kind:
        description: "Release kind for audit context. This does not calculate the version."
        required: true
        default: "minor"
        type: choice
        options:
          - patch
          - minor
          - major
          - hotfix
"""

    text = replace_once(text, old_inputs, new_inputs, "workflow_dispatch inputs")

    old_validate = """          $version = "${{ github.event.inputs.version }}".Trim()

          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+$') {
"""

    new_validate = """          $version = "${{ github.event.inputs.version }}".Trim()
          $releaseKind = "${{ github.event.inputs.release_kind }}".Trim()

          if ($releaseKind -notin @("patch", "minor", "major", "hotfix")) {
            throw "release_kind must be one of: patch, minor, major, hotfix. Got '$releaseKind'."
          }

          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+$') {
"""

    text = replace_once(text, old_validate, new_validate, "version validation block")

    old_env = """          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
"""

    new_env = """          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_KIND=$releaseKind" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
"""

    text = replace_once(text, old_env, new_env, "GITHUB_ENV release variables")

    old_log = """          Write-Host "Release version: $version"
          Write-Host "Release tag: $tag"
"""

    new_log = """          Write-Host "Release version: $version"
          Write-Host "Release kind: $releaseKind"
          Write-Host "Release tag: $tag"
"""

    text = replace_once(text, old_log, new_log, "release metadata logs")

    old_summary = """            "Version: $env:RELEASE_VERSION"
            "Release title: $env:RELEASE_TITLE"
"""

    new_summary = """            "Version: $env:RELEASE_VERSION"
            "Release kind: $env:RELEASE_KIND"
            "Release title: $env:RELEASE_TITLE"
"""

    text = replace_once(text, old_summary, new_summary, "package summary release kind")

    if args.dry_run:
        print(f"[dry-run] Would update {workflow_path}")
        print("[dry-run] Add release_kind workflow input and package summary field.")
        return 0

    workflow_path.write_text(text, encoding="utf-8", newline="\n")
    print(f"Updated {workflow_path}")
    print("Added release_kind workflow input and package summary field.")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
